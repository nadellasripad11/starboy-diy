<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1200" height="760" fill="#f7f7f5"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1d1d1f">starboy wiring</text>
  <text x="250" y="46" font-size="15" fill="#6b6b70">every module goes to the seeed xiao esp32c3</text>

  <!-- GC9A01 -->
  <g>
    <rect x="40" y="80" width="170" height="268" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
    <rect x="40" y="80" width="170" height="36" rx="8" fill="#1d1d1f"/>
    <rect x="40" y="104" width="170" height="12" fill="#1d1d1f"/>
    <text x="125" y="104" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">GC9A01 TFT</text>
    <g font-size="14" fill="#1d1d1f" text-anchor="end">
      <text x="198" y="135">VCC</text><text x="198" y="163">GND</text><text x="198" y="191">SCL</text><text x="198" y="219">SDA</text>
      <text x="198" y="247">DC</text><text x="198" y="275">CS</text><text x="198" y="303">RST</text><text x="198" y="331">BL</text>
    </g>
    <g stroke-width="3">
      <line x1="210" y1="130" x2="340" y2="130" stroke="#d62828"/><line x1="210" y1="158" x2="340" y2="158" stroke="#222222"/>
      <line x1="210" y1="186" x2="340" y2="186" stroke="#e76f00"/><line x1="210" y1="214" x2="340" y2="214" stroke="#1b998b"/>
      <line x1="210" y1="242" x2="340" y2="242" stroke="#7b2cbf"/><line x1="210" y1="270" x2="340" y2="270" stroke="#3a86ff"/>
      <line x1="210" y1="298" x2="340" y2="298" stroke="#d62828"/><line x1="210" y1="326" x2="340" y2="326" stroke="#b08900"/>
    </g>
    <g>
      <rect x="340" y="119" width="190" height="22" rx="11" fill="#d62828"/><rect x="340" y="147" width="190" height="22" rx="11" fill="#222222"/>
      <rect x="340" y="175" width="190" height="22" rx="11" fill="#e76f00"/><rect x="340" y="203" width="190" height="22" rx="11" fill="#1b998b"/>
      <rect x="340" y="231" width="190" height="22" rx="11" fill="#7b2cbf"/><rect x="340" y="259" width="190" height="22" rx="11" fill="#3a86ff"/>
      <rect x="340" y="287" width="190" height="22" rx="11" fill="#d62828"/><rect x="340" y="315" width="190" height="22" rx="11" fill="#b08900"/>
    </g>
    <g font-size="13" fill="#ffffff" text-anchor="middle">
      <text x="435" y="135">3V3</text><text x="435" y="163">GND</text><text x="435" y="191">D8 · GPIO8</text><text x="435" y="219">D10 · GPIO10</text>
      <text x="435" y="247">D6 · GPIO21</text><text x="435" y="275">D3 · GPIO5</text><text x="435" y="303">3V3</text><text x="435" y="331">D2 · GPIO4 (PWM)</text>
    </g>
  </g>

  <!-- MAX4466 -->
  <g>
    <rect x="40" y="400" width="170" height="128" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
    <rect x="40" y="400" width="170" height="36" rx="8" fill="#1d1d1f"/>
    <rect x="40" y="424" width="170" height="12" fill="#1d1d1f"/>
    <text x="125" y="424" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">MAX4466 mic</text>
    <g font-size="14" fill="#1d1d1f" text-anchor="end"><text x="198" y="455">VCC</text><text x="198" y="483">GND</text><text x="198" y="511">OUT</text></g>
    <g stroke-width="3">
      <line x1="210" y1="450" x2="340" y2="450" stroke="#d62828"/><line x1="210" y1="478" x2="340" y2="478" stroke="#222222"/><line x1="210" y1="506" x2="340" y2="506" stroke="#8338ec"/>
    </g>
    <rect x="340" y="439" width="190" height="22" rx="11" fill="#d62828"/><rect x="340" y="467" width="190" height="22" rx="11" fill="#222222"/><rect x="340" y="495" width="190" height="22" rx="11" fill="#8338ec"/>
    <g font-size="13" fill="#ffffff" text-anchor="middle"><text x="435" y="455">3V3</text><text x="435" y="483">GND</text><text x="435" y="511">D1 · GPIO3 (ADC)</text></g>
  </g>

  <!-- LiPo -->
  <g>
    <rect x="40" y="570" width="170" height="100" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
    <rect x="40" y="570" width="170" height="36" rx="8" fill="#1d1d1f"/>
    <rect x="40" y="594" width="170" height="12" fill="#1d1d1f"/>
    <text x="125" y="594" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">LiPo 402530</text>
    <g font-size="14" fill="#1d1d1f" text-anchor="end"><text x="198" y="625">+</text><text x="198" y="653">−</text></g>
    <g stroke-width="3"><line x1="210" y1="620" x2="340" y2="620" stroke="#d62828"/><line x1="210" y1="648" x2="340" y2="648" stroke="#222222"/></g>
    <rect x="340" y="609" width="190" height="22" rx="11" fill="#d62828"/><rect x="340" y="637" width="190" height="22" rx="11" fill="#222222"/>
    <g font-size="13" fill="#ffffff" text-anchor="middle"><text x="435" y="625">BAT+ pad (underside)</text><text x="435" y="653">BAT− pad (underside)</text></g>
  </g>

  <!-- MPU6050 -->
  <g>
    <rect x="620" y="80" width="170" height="184" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
    <rect x="620" y="80" width="170" height="36" rx="8" fill="#1d1d1f"/>
    <rect x="620" y="104" width="170" height="12" fill="#1d1d1f"/>
    <text x="705" y="104" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">MPU6050 GY-521</text>
    <g font-size="14" fill="#1d1d1f" text-anchor="end">
      <text x="778" y="135">VCC</text><text x="778" y="163">GND</text><text x="778" y="191">SDA</text><text x="778" y="219">SCL</text><text x="778" y="247">AD0</text>
    </g>
    <g stroke-width="3">
      <line x1="790" y1="130" x2="920" y2="130" stroke="#d62828"/><line x1="790" y1="158" x2="920" y2="158" stroke="#222222"/>
      <line x1="790" y1="186" x2="920" y2="186" stroke="#06a77d"/><line x1="790" y1="214" x2="920" y2="214" stroke="#0077b6"/>
      <line x1="790" y1="242" x2="920" y2="242" stroke="#222222"/>
    </g>
    <rect x="920" y="119" width="190" height="22" rx="11" fill="#d62828"/><rect x="920" y="147" width="190" height="22" rx="11" fill="#222222"/>
    <rect x="920" y="175" width="190" height="22" rx="11" fill="#06a77d"/><rect x="920" y="203" width="190" height="22" rx="11" fill="#0077b6"/>
    <rect x="920" y="231" width="190" height="22" rx="11" fill="#222222"/>
    <g font-size="13" fill="#ffffff" text-anchor="middle">
      <text x="1015" y="135">3V3</text><text x="1015" y="163">GND</text><text x="1015" y="191">D4 · GPIO6</text><text x="1015" y="219">D5 · GPIO7</text><text x="1015" y="247">GND (addr 0x68)</text>
    </g>
  </g>

  <!-- DS18B20 -->
  <g>
    <rect x="620" y="310" width="170" height="128" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
    <rect x="620" y="310" width="170" height="36" rx="8" fill="#1d1d1f"/>
    <rect x="620" y="334" width="170" height="12" fill="#1d1d1f"/>
    <text x="705" y="334" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DS18B20 TO-92</text>
    <g font-size="14" fill="#1d1d1f" text-anchor="end"><text x="778" y="365">VDD</text><text x="778" y="393">GND</text><text x="778" y="421">DATA</text></g>
    <g stroke-width="3">
      <line x1="790" y1="360" x2="920" y2="360" stroke="#d62828"/><line x1="790" y1="388" x2="920" y2="388" stroke="#222222"/><line x1="790" y1="416" x2="920" y2="416" stroke="#6a994e"/>
    </g>
    <!-- 4.7k pull-up between DATA and VDD, drawn to the right of the GND wire -->
    <g stroke="#1d1d1f" stroke-width="2" fill="none">
      <polyline points="880,360 880,368 872,372 888,378 872,384 888,390 872,396 888,402 880,406 880,416"/>
    </g>
    <circle cx="880" cy="360" r="3.5" fill="#1d1d1f"/><circle cx="880" cy="416" r="3.5" fill="#1d1d1f"/>
    <text x="846" y="452" font-size="13" fill="#1d1d1f">4.7kΩ pull-up</text>
    <rect x="920" y="349" width="190" height="22" rx="11" fill="#d62828"/><rect x="920" y="377" width="190" height="22" rx="11" fill="#222222"/><rect x="920" y="405" width="190" height="22" rx="11" fill="#6a994e"/>
    <g font-size="13" fill="#ffffff" text-anchor="middle"><text x="1015" y="365">3V3</text><text x="1015" y="393">GND</text><text x="1015" y="421">D7 · GPIO20</text></g>
  </g>

  <!-- notes -->
  <g>
    <rect x="620" y="490" width="540" height="180" rx="8" fill="#ffffff" stroke="#c9c9ce" stroke-width="1.5"/>
    <text x="644" y="522" font-size="15" font-weight="700" fill="#1d1d1f">notes</text>
    <g font-size="13.5" fill="#3a3a3f">
      <text x="644" y="550">· all modules run on the xiao's 3V3 rail</text>
      <text x="644" y="576">· D0 (GPIO2) and D9 (GPIO9) stay free: boot strapping pins</text>
      <text x="644" y="602">· display RST tied to 3V3, firmware uses a software reset</text>
      <text x="644" y="628">· BL on PWM so the backlight dims when the eye sleeps</text>
      <text x="644" y="654">· headers removed from the TFT and GY-521, wires soldered flat</text>
    </g>
  </g>

  <text x="40" y="730" font-size="12.5" fill="#6b6b70">pin labels are the xiao silkscreen names · GPIO numbers match firmware/starboy_firmware/User_Setup.h</text>
</svg>

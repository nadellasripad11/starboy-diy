<!-- Browser preview of the firmware's eyes. It uses the website's renderer
     (web/eyes.js), which tools/check_parity.js keeps in sync with drawEye() and
     drawSpecialFX() in starboy_firmware.ino, so there is one copy to maintain.
     Open it in any browser. -->
<title>starboy eye preview</title>
<style>
  body { margin: 0; background: #0b0b0c; color: #e8e8ea; font: 13px ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 16px 20px 4px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .muted { color: #8a8a90; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 20px 4px; align-items: center; }
  .label { color: #8a8a90; width: 56px; }
  button { background: #1c1c1f; color: #e8e8ea; border: 1px solid #2c2c31; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #e8e8ea; color: #0b0b0c; }
  button:focus-visible { outline: 2px solid #7b43f5; outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 14px 20px 24px; }
  figure { margin: 0; text-align: center; }
  canvas { width: 100%; aspect-ratio: 1; border-radius: 50%; background: #000; display: block; }
  figcaption { margin-top: 6px; }
</style>
<header>
  <h1>starboy eye preview</h1>
  <span class="muted">100 colorways × 4 shapes · 240×240 like the real display</span>
</header>
<div class="controls" id="shapes"><span class="label">shape</span></div>
<div class="controls" id="moods"><span class="label">mood</span></div>
<div class="controls" id="fxs"><span class="label">rare fx</span></div>
<div class="grid" id="grid"></div>
<script src="../web/eyes.js"></script>
<script>
const E = window.StarboyEyes;

// expression values from the firmware's EXPR table and setTarget()
const MOODS = {
  neutral: {},
  happy:   { blinkT: 0.08, pupR: 1.10, irY: 0.9, smile: 0.8 },
  angry:   { pupR: 0.75, irY: 0.8, bwL: 14, bwR: 14, bwY: 4 },
  drowsy:  { blinkT: 0.55, pupR: 0.95, irY: 0.8, bwY: 4 },
  shocked: { pupR: 1.40, irX: 1.1 },
};
// rare effects with the expression each one plays over in setupRareTarget()
const FX = [
  { id: 0, name: 'none' }, { id: 1, name: 'rainbow' }, { id: 2, name: 'hearts' }, { id: 3, name: 'stars' },
  { id: 4, name: 'glitch' }, { id: 6, name: 'hypno' }, { id: 7, name: 'loading' },
  { id: 8, name: 'error', mood: { pupR: 1.4, irX: 1.1 } }, { id: 9, name: 'derp' },
  { id: 10, name: 'frost', mood: { blinkT: 0.25, pupR: 0.6, irY: 1.2, bwL: 12, bwR: 12, bwY: 5, colMix: 0.5, colOvr: '#0000ff' } },
  { id: 11, name: 'dream', mood: { blinkT: 0.8 }, speed: 2.4 },
  { id: 12, name: 'cry', mood: { blinkT: 0.55, irY: 0.8, bwY: 4 } },
  { id: 13, name: 'laugh', mood: { blinkT: 0.08, smile: 1 } },
  { id: 14, name: 'shocked', mood: { pupR: 0.45, irX: 1.1 } },
  { id: 15, name: 'dead' }, { id: 16, name: 'galaxy' }, { id: 17, name: 'heartbeat' },
  { id: 18, name: 'fire', mood: { blinkT: 0.4, pupR: 0.85, irY: 0.88, bwL: 7, bwR: 7, bwY: 2 } },
  { id: 20, name: 'rgb split' },
];
const BASE = { gx: 0, gy: 0, blinkT: 0, blinkB: 0, pupR: 1, irX: 1, irY: 1, bwL: 0, bwR: 0, bwY: 0, smile: 0, colMix: 0, colOvr: '#000000', fx: 0, fxP: 0 };

let shapeFilter = -1, mood = 'neutral', fxPick = 0;
function buttons(el, items, current, onPick) {
  for (const [val, label] of items) {
    const b = document.createElement('button');
    b.textContent = label; b.dataset.val = String(val);
    b.setAttribute('aria-pressed', String(val === current()));
    b.onclick = () => { onPick(val); el.querySelectorAll('button').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.val === String(current())))); };
    el.appendChild(b);
  }
}
buttons(document.getElementById('shapes'), [[-1, 'mixed'], ...E.SHAPES.map((s, i) => [i, s])], () => shapeFilter, v => shapeFilter = v);
buttons(document.getElementById('moods'), Object.keys(MOODS).map(m => [m, m]), () => mood, v => mood = v);
buttons(document.getElementById('fxs'), FX.map(f => [f.id, f.name]), () => fxPick, v => fxPick = v);

const grid = document.getElementById('grid');
const cells = E.COLORWAYS.map((cw, i) => {
  const fig = document.createElement('figure');
  const cv = document.createElement('canvas'); cv.width = cv.height = 240;
  const cap = document.createElement('figcaption');
  fig.append(cv, cap); grid.appendChild(fig);
  return { cw, i, g: cv.getContext('2d'), cap, seedShape: [0, 1, 1, 1, 1, 2, 2, 2, 3, 3][(i * 7) % 10],
           phase: Math.random() * 10000, nextBlink: 2200 + Math.random() * 4300, glance: { t: 0, gx: 0, gy: 0 } };
});

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t) {
  const fx = FX.find(f => f.id === fxPick);
  const m = { ...(fxPick ? {} : MOODS[mood]), ...(fx.mood || {}) };
  for (const c of cells) {
    const shape = shapeFilter < 0 ? c.seedShape : shapeFilter;
    const lt = t + c.phase;
    if (!reduceMotion && lt - c.glance.t > 900 + (c.phase % 2300)) {
      c.glance.t = lt;
      const back = Math.random() < 0.33;
      c.glance.gx = back ? 0 : Math.round(Math.random() * 28 - 14);
      c.glance.gy = back ? 0 : Math.round(Math.random() * 12 - 6);
    }
    const blinkAge = (lt % (c.nextBlink + 200)) - c.nextBlink;
    const blink = reduceMotion ? 0 : blinkAge > 0 ? (blinkAge < 80 ? blinkAge / 80 : 1 - (blinkAge - 80) / 120) * 0.95 : 0;
    const fxP = (lt / 1000) * 1.5 * (fx.speed || 1);
    const eye = { ...BASE, ...m, fx: fxPick, fxP };
    eye.gx = fxPick ? 0 : c.glance.gx;
    eye.gy = fxPick === 13 ? Math.sin(fxP * 6) * 3 : fxPick ? 0 : c.glance.gy;
    eye.blinkT = Math.max(m.blinkT || 0, blink);
    eye.blinkB = eye.blinkT * 0.45;
    E.render(c.g, eye, shape, c.cw, t);
    c.cap.innerHTML = `${E.SHAPES[shape]} ${c.cw.name} <span class="muted">${E.rarity(c.i).toFixed(1)}%</span>`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
